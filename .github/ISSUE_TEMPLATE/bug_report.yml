name: Bug report
description: A tool does not do what it says, or fails for no visible reason
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Please do **not** paste document contents, client names, or absolute
        paths containing your user name into this form.

        Before filing: if a tool fails without an explanation, run
        `npm run verify-api` against your InDesign first. A DOM property this
        version dropped aborts the whole call, which looks exactly like the
        tool doing nothing — and the report is far more useful with that
        output in it.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you expect, and what happened instead?
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: The tool calls and their arguments, if you have them.
      placeholder: |
        1. create_document with preset A4
        2. create_text_frame at x 20, y 20, 100 x 40 mm
        3. inspect_page reports ...
    validations:
      required: true

  - type: input
    id: indesign-version
    attributes:
      label: InDesign version
      description: Help → About, or the value `npm run smoke` prints.
      placeholder: "21.5.1.73"
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Windows (PowerShell + COM)
        - macOS (osascript)
    validations:
      required: true

  - type: input
    id: node-version
    attributes:
      label: Node version
      placeholder: "20.11.0"
    validations:
      required: true

  - type: input
    id: server-version
    attributes:
      label: Server version
      description: From package.json, or the version your MCP client reports.
      placeholder: "2.2.0"
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - Seeing the document (inspect_page, check_layout, get_text_content)
        - Building pages (documents, frames, shapes, images, tables)
        - Changing what is there (move, resize, format, effects)
        - Text and styles
        - Output (PDF, images, EPUB, IDML, package, preflight)
        - Generic access (inspect_object, set_properties, call_method)
        - The driver itself (connection, undo, temp files)
        - Other / unclear
    validations:
      required: true

  - type: textarea
    id: verify-api
    attributes:
      label: verify-api output
      description: The output of `npm run verify-api`, if it reported anything missing.
      render: text

  - type: textarea
    id: message
    attributes:
      label: What the tool returned
      description: The full message, including any ERROR line.
      render: text

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: InDesign was running with no modal dialog open — a dialog blocks every scripted call until it is dismissed
          required: true
        - label: I ran `npm run verify-api` and pasted anything it reported
        - label: I have removed document contents and personal paths from this report
          required: true
