name: Compatibility report
description: Report the server working (or breaking) on an InDesign version not listed yet
labels: ["compatibility"]
body:
  - type: markdown
    attributes:
      value: |
        Only Windows 11 with InDesign 21.5 is verified. Everything else should
        work through the generic ProgID or the macOS application names, but
        nobody has confirmed it — which is why these reports are worth more
        here than in most projects.

        `npm run verify-api` is the useful part: it checks every DOM property
        and enum member the server writes against your InDesign and names the
        ones that are missing. A version that drops or renames a property is
        exactly what this report should capture.

  - type: input
    id: indesign-version
    attributes:
      label: InDesign version
      placeholder: "20.2.0.90"
    validations:
      required: true

  - type: input
    id: os-version
    attributes:
      label: Operating system
      placeholder: "Windows 11 26100 / macOS 15.3"
    validations:
      required: true

  - type: input
    id: node-version
    attributes:
      label: Node version
      placeholder: "20.11.0"
    validations:
      required: true

  - type: input
    id: server-version
    attributes:
      label: Server version
      placeholder: "2.2.0"
    validations:
      required: true

  - type: dropdown
    id: result
    attributes:
      label: Result
      options:
        - Works — smoke, tests and verify-api all clean
        - Works — but verify-api reports missing names
        - Partially broken — some tools fail
        - Does not connect at all
    validations:
      required: true

  - type: textarea
    id: verify-api
    attributes:
      label: verify-api output
      description: Paste the whole run, including the summary line.
      render: text

  - type: textarea
    id: details
    attributes:
      label: Details
      description: |
        Which end-to-end scripts did you run, and what did you observe? If the
        server could not connect at all, the registered ProgID (Windows) or
        application name (macOS) is the thing to include.
    validations:
      required: true
